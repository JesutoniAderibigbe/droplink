# DropLink CI/CD
#
#   every push / PR:  checks ─┬─ db-tests ─┬─ (main only) deploy
#                             └─ e2e ──────┘
#
# deploy runs only on main (pushes, or a manual run), after every test job passes, in this
# order: database migrations → Edge Functions → build → Netlify → smoke test.
# GitHub builds the site and uploads dist/ (Netlify doesn't build), so build
# logs live here.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, NETLIFY_AUTH_TOKEN
#   variables: SUPABASE_PROJECT_REF, NETLIFY_SITE_ID, SITE_URL,
#              VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_VAPID_PUBLIC_KEY

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Production build (placeholder env, just proves it builds)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_VAPID_PUBLIC_KEY: ci-placeholder

  db-tests:
    name: RLS, Storage, Realtime, quotas (local Supabase)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: ./scripts/ci-local-stack.sh
      - run: npm run test:rls
      - if: failure()
        run: tail -100 /tmp/functions.log || true

  e2e:
    name: End-to-end (two browser "devices")
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/ci-local-stack.sh
      - name: Start dev server and production preview
        run: |
          nohup npm run dev > /tmp/dev.log 2>&1 &
          npm run build
          nohup npm run preview > /tmp/preview.log 2>&1 &
          for port in 5173 4173; do
            for _ in $(seq 1 60); do curl -sk -o /dev/null "https://localhost:$port/" && break; sleep 1; done
          done
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    # Pushes to main, or a manual "Run workflow" on main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [db-tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci

      - name: Database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD" --yes

      - name: Edge Functions
        run: supabase functions deploy turn-credentials notify-device relay-cleanup delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Netlify (upload dist/, no Netlify build)
        run: >
          npx -y netlify-cli@latest deploy --prod --no-build --dir dist
          --site "${{ vars.NETLIFY_SITE_ID }}" --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}"
          --message "${{ github.sha }}"

      - name: Smoke test the live site
        run: |
          set -e
          url="${{ vars.SITE_URL }}"
          curl -fsS "$url/" | grep -q '<div id="app">'
          curl -fsSI "$url/" | grep -qi "content-security-policy:.*${SUPABASE_PROJECT_REF}.supabase.co"
          curl -fsSI "$url/sw.js" | grep -qi 'cache-control: no-cache'
          curl -fsS "$url/manifest.webmanifest" | grep -q '"share_target"'
          curl -fsS "$url/send" | grep -q '<div id="app">'   # SPA fallback
          echo "live site OK"
