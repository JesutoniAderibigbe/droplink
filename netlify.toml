# Netlify: static build of the PWA. The backend is Supabase.
# The Content-Security-Policy is generated at build time into dist/_headers
# (scripts/write-headers.mjs) so it can name your Supabase project exactly.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These three are public by design (bundled into the app). Exempt only them
  # from Netlify's secrets scanner, never the scanner as a whole.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_VAPID_PUBLIC_KEY"
  # Smart detection matches key-shaped strings regardless of variable name.
  # These exact values are the public Supabase publishable key and the public
  # VAPID key (both shipped to every browser).
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "sb_publishable_Xccmhe4rBfSsQr4VvWFeBA_SKuRy3-z,BFvqV0x8pUXqMKCoErIzPSsetZa1JrGRw2j8-jjyFLmUN_90Uh6N_w9tzshWPhvlXHL29PSX7V9ynWNwsB-yxII"

# Single-page app: every path (/, /send, /receive?transfer=…) serves the shell.
# /share-target is handled by the service worker, which is installed before
# the share sheet ever offers DropLink.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# Always revalidate the service worker, manifest and app shell so updates ship
# immediately. Hashed assets can be cached forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
